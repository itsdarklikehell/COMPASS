name: Gource visualization

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "${{ github.event.repository.name }} development timeline"
          gource_resolution: 720p
          gource_fps: 30
          gource_filename_time: 2
          gource_hide_items: "mouse,date,filenames"
          gource_max_files: 500
          gource_highlight_users: true
          gource_output_framerate: 20
          gource_stop_at_end: true
          gource_auto_skip_seconds: 0.3
          gource_seconds_per_day: 1

      - name: Commit gource video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
